<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rezume — генератор резюме</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="letter.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Press+Start+2P&family=Orbitron:wght@500;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<button id="burger" class="burger" aria-label="Меню">☰</button>
<div class="app">
  <aside class="panel" id="panel">
    <h1 class="brand">Rezume<span>.gen</span></h1>
    <div class="tabs pagetabs">
      <a href="/" class="active">1 · Резюме</a>
      <a href="/letter">2 · Письмо под вакансию</a>
    </div>

    <section class="group">
      <h2>Профессия (шаблон)</h2>
      <select id="preset">
        <option value="universal">Мультипрофиль: разработчик + преподаватель ⭐</option>
        <option value="frontend">Frontend-разработчик</option>
        <option value="research">Специалист по количественным исследованиям</option>
        <option value="qa">QA Engineer</option>
        <option value="teacher">Преподаватель IT / методист</option>
      </select>
    </section>

    <section class="group">
      <h2>Стиль</h2>
      <div class="themes" id="themes">
        <button data-theme="pro" class="tbtn">Деловой ⭐</button>
        <button data-theme="neon" class="tbtn">Неон</button>
        <button data-theme="pixel" class="tbtn">Гейм-пиксели</button>
        <button data-theme="apple" class="tbtn">Apple</button>
        <button data-theme="gemini" class="tbtn">Gemini</button>
        <button data-theme="plain" class="tbtn">Обычный</button>
      </div>
    </section>

    <section class="group">
      <h2>Основное</h2>
      <label>Имя <input id="f-name"></label>
      <label>Должность <input id="f-role"></label>
      <label>Город <input id="f-city"></label>
      <label>Email <input id="f-email"></label>
      <label>Телефон <input id="f-phone"></label>
      <label>GitHub <input id="f-github"></label>
      <label>Telegram <input id="f-tg"></label>
      <label>Фото
        <span class="photorow">
          <button type="button" id="btn-photo">Загрузить с компьютера</button>
          <button type="button" id="btn-photo-del" title="Убрать фото">×</button>
        </span>
        <input type="file" id="file-photo" accept="image/*" hidden>
        <input id="f-photo" placeholder="или вставь URL картинки">
      </label>
      <label>О себе <textarea id="f-about" rows="4"></textarea></label>
    </section>

    <section class="group">
      <h2>Ключевые достижения <button class="add" data-add="achievements">+</button></h2>
      <div id="list-achievements" class="list"></div>
    </section>

    <section class="group">
      <h2>Навыки <button class="add" data-add="skills">+</button></h2>
      <div id="list-skills" class="list"></div>
    </section>

    <section class="group">
      <h2>Проекты <button class="add" data-add="projects">+</button></h2>
      <div id="list-projects" class="list"></div>
    </section>

    <section class="group">
      <h2>Опыт / Учёба <button class="add" data-add="exp">+</button></h2>
      <div id="list-exp" class="list"></div>
    </section>

    <section class="group">
      <h2>Плотность страниц</h2>
      <select id="fitmode">
        <option value="auto">Авто-подгонка (рекомендую)</option>
        <option value="off">Выключить</option>
      </select>
      <p class="hint" id="fitinfo" style="margin-top:8px"></p>
    </section>

    <section class="group actions">
      <button id="btn-print">Скачать PDF / Печать</button>
      <button id="btn-export">Экспорт JSON</button>
      <button id="btn-import">Импорт JSON</button>
      <button id="btn-reset" class="danger">Сбросить</button>
      <input type="file" id="file-import" accept="application/json" hidden>
    </section>
    <p class="hint">Данные сохраняются в браузере автоматически.</p>
  </aside>

  <main class="preview">
    <div id="paper" class="paper theme-neon"></div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
